[Language_en]
Name=R.A.T.S. Keel
Description=Replaces Anchor Chain's loader: loads code mods (Anchor Chain mods included), checks every mod against your game version first (a mod made for another version no longer stops missions from loading), starts each mod on its own so one broken mod cannot stop the others, only loads mods switched on in Mods, and shows what started and why not (Ctrl+Shift+K). Maintained with the R.A.T.S. mods; updates come through the Workshop. Copy the Keel stub into BepInEx\plugins once and delete AnchorChain.Preloader.dll; keep Anchor Chain subscribed.

[Compatibility]
GreaterThanEqualToVersion=0.8.7
LessThanVersion=0.10.0
