[Language_en]
Name=R.A.T.S. Keel
Description=The mod loader for Sea Power: starts your code mods (Anchor Chain mods and BepInEx plugins as they are), checks every mod against your game version first (a mod made for another version no longer stops missions from loading), starts each mod on its own so one broken mod cannot stop the others, only loads mods switched on in Mods, and shows what started and why not (Ctrl+Shift+K). Other loaders' files stay as they are: switch Keel off and they start again. Set up once with KeelSetup.exe from Keel's folder; updates come through the Workshop.

[Compatibility]
GreaterThanEqualToVersion=0.8.7
LessThanVersion=0.10.0
