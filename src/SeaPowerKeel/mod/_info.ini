[Language_en]
Name=R.A.T.S. Keel
Description=A mod loader for code mods. Checks every mod against your game version before starting it (a mod made for another version no longer stops missions from loading), starts each mod on its own so one broken mod cannot stop the others or freeze the game, and shows what started and why not (Ctrl+Shift+K). Runs plain BepInEx plugins and Anchor Chain mods. Needs the small Keel stub in BepInEx\plugins once.

[Compatibility]
ApproximateVersion=0.8.7
