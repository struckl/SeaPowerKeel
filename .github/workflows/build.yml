name: Build
on:
  push:
    branches: [main, keel-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executables:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build KeelWatcher.exe and KeelSetup.exe from source
        shell: pwsh
        run: ./tools/ci-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: keel-executables
          path: dist-ci/*.exe
          if-no-files-found: error
